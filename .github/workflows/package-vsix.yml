name: Package VSIX

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch/tag/sha) to build
        required: false
        default: main
        type: string
      tag:
        description: GitHub Release tag to upload the VSIX to (optional)
        required: false
        type: string
  push:
    tags:
      - "@mduml/adapter-vscode-*"
      - "@mduml/adapter-vscode@*"
      - "vscode-v*"

permissions:
  contents: write

concurrency:
  group: package-vsix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vsix:
    name: Build & Package VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VS Code extension
        run: pnpm -w --filter @mduml/adapter-vscode run build

      - name: Package VSIX
        run: pnpm -w --filter @mduml/adapter-vscode run package:vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mduml-vsix
          path: packages/adapter-vscode/dist/vsix/mduml.vsix
          if-no-files-found: error

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          TAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX to GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: packages/adapter-vscode/dist/vsix/mduml.vsix
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
