name: Package Obsidian Plugin

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch/tag/sha) to build
        required: false
        default: main
        type: string
      tag:
        description: GitHub Release tag to upload the plugin zip to (optional)
        required: false
        type: string
  push:
    tags:
      - "@mduml/adapter-obsidian-*"
      - "@mduml/adapter-obsidian@*"
      - "obsidian-v*"

permissions:
  contents: write

concurrency:
  group: package-obsidian-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugin:
    name: Build & Package Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Obsidian plugin
        run: npm run build -w @mduml/adapter-obsidian

      - name: Package plugin folder
        run: npm run package:plugin -w @mduml/adapter-obsidian

      - name: Create zip
        id: zip
        shell: bash
        run: |
          PLUGIN_ID="$(node -p "require('./packages/adapter-obsidian/manifest.json').id")"
          TAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -n "$TAG" ]; then
            ZIP_NAME="obsidian-${PLUGIN_ID}-${TAG}.zip"
          else
            ZIP_NAME="obsidian-${PLUGIN_ID}-${GITHUB_SHA::7}.zip"
          fi
          OUT_DIR="packages/adapter-obsidian/dist"
          mkdir -p "$OUT_DIR"
          test -d "packages/adapter-obsidian/dist/obsidian-plugin/${PLUGIN_ID}"
          (cd "packages/adapter-obsidian/dist/obsidian-plugin" && zip -r "../${ZIP_NAME}" "${PLUGIN_ID}")
          echo "zipPath=${OUT_DIR}/${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-plugin
          path: ${{ steps.zip.outputs.zipPath }}
          if-no-files-found: error

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          TAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload zip to GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ${{ steps.zip.outputs.zipPath }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
