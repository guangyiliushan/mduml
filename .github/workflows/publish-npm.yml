name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode: single (publish 1 package from @mduml/* tag) or all (publish all public workspace packages at current ref)"
        required: false
        default: "all"
        type: string
      tag:
        description: "Tag to publish (required for single mode when manually triggered)"
        required: false
        type: string
  push:
    tags:
      - "@mduml/*"
      - "release-v*"
      - "v*"

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish:
    name: Publish Package
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Resolve workspace from tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi

          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}"
          if [ -z "$MODE" ]; then
            if [[ "$TAG" == @mduml/* ]]; then
              MODE="single"
            else
              MODE="all"
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          if [ "$MODE" != "single" ]; then
            echo "Publishing mode=all at ref: $GITHUB_SHA"
            exit 0
          fi

          if [ -z "$TAG" ]; then
            echo "Error: tag is required for single mode. Provide workflow_dispatch input 'tag' or trigger this workflow by pushing an @mduml/* tag." >&2
            exit 1
          fi

          if [[ "$TAG" != @mduml/* ]]; then
            echo "Error: single mode expects an @mduml/* tag. Got: $TAG" >&2
            exit 1
          fi

          echo "Resolving tag: $TAG"
          JSON="$(node scripts/resolve-workspace-from-tag.mjs "$TAG")"
          echo "$JSON" > /tmp/uml-flow-tag.json
          echo "Resolved: $JSON"
          
          # Parse and validate
          WORKSPACE_NAME=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/uml-flow-tag.json','utf8')); if(!j.ok) { console.error('Invalid tag'); process.exit(1); } console.log(j.workspaceName);")
          WORKSPACE_DIR=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/uml-flow-tag.json','utf8')); if(!j.ok) process.exit(1); console.log(j.workspaceDir);")
          VERSION=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/uml-flow-tag.json','utf8')); console.log(j.version);")
          
          echo "workspaceName=$WORKSPACE_NAME" >> "$GITHUB_OUTPUT"
          echo "workspaceDir=$WORKSPACE_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $WORKSPACE_NAME@$VERSION"

      - name: Collect publish targets (all mode)
        if: steps.resolve.outputs.mode == 'all'
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/publish-targets.json
          const fs = require("node:fs");
          const path = require("node:path");

          const packagesDir = path.join(process.cwd(), "packages");
          const dirs = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((d) => d.isDirectory())
            .map((d) => d.name);

          const targets = [];
          for (const dir of dirs) {
            const p = path.join(packagesDir, dir, "package.json");
            const json = JSON.parse(fs.readFileSync(p, "utf8"));
            if (json.private === true) continue;
            if (typeof json.name !== "string" || json.name.length === 0) continue;
            targets.push({ name: json.name, dir, version: String(json.version ?? "") });
          }

          process.stdout.write(JSON.stringify({ ok: true, targets }, null, 2));
          NODE

          echo "Targets:"
          cat /tmp/publish-targets.json

      - name: Verify package exists
        if: steps.resolve.outputs.mode == 'single'
        run: |
          if [ ! -d "packages/${{ steps.resolve.outputs.workspaceDir }}" ]; then
            echo "Error: Package directory not found"
            exit 1
          fi

      - name: Check if package is publishable
        id: publishable
        shell: bash
        run: |
          if [ "${{ steps.resolve.outputs.mode }}" = "all" ]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PRIVATE=$(node -e "const p=require('./packages/${{ steps.resolve.outputs.workspaceDir }}/package.json'); console.log(String(!!p.private));")
          if [ "$PRIVATE" = "true" ]; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publish: ${{ steps.resolve.outputs.workspaceName }} is private"
          else
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure NPM_TOKEN is set
        if: steps.publishable.outputs.publishable == 'true' && env.NPM_TOKEN == ''
        shell: bash
        run: |
          echo "Error: NPM_TOKEN is not set"
          exit 1

      - name: Configure npm authentication
        if: steps.publishable.outputs.publishable == 'true'
        shell: bash
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Check if already published
        id: check
        if: steps.publishable.outputs.publishable == 'true' && steps.resolve.outputs.mode == 'single'
        run: |
          PACKAGE_NAME="${{ steps.resolve.outputs.workspaceName }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          
          if npm view "$PACKAGE_NAME@$VERSION" version &>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Package $PACKAGE_NAME@$VERSION is already published"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "✅ Package $PACKAGE_NAME@$VERSION is not published yet"
          fi

      - name: Publish all public packages
        if: steps.publishable.outputs.publishable == 'true' && steps.resolve.outputs.mode == 'all'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node -e "const j=require('/tmp/publish-targets.json'); if(!j.ok) process.exit(1); for(const t of j.targets){ if(!t.name||!t.version) continue; console.log(t.name+'\t'+t.version); }" \
            | while IFS=$'\t' read -r name version; do
                if [ -z "$name" ] || [ -z "$version" ]; then
                  continue
                fi

                if npm view "$name@$version" version &>/dev/null; then
                  echo "⚠️ Skip: $name@$version already published"
                  continue
                fi

                echo "Publishing $name@$version"
                pnpm -w --filter "$name" publish --access public --no-git-checks
              done

      - name: Publish to NPM
        if: steps.publishable.outputs.publishable == 'true' && steps.resolve.outputs.mode == 'single' && steps.check.outputs.already_published == 'false'
        run: |
          echo "Publishing ${{ steps.resolve.outputs.workspaceName }}@${{ steps.resolve.outputs.version }}"
          pnpm -w --filter "${{ steps.resolve.outputs.workspaceName }}" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish success
        if: steps.publishable.outputs.publishable == 'true' && success()
        run: |
          if [ "${{ steps.resolve.outputs.mode }}" = "all" ]; then
            echo "✅ Successfully published all public workspace packages"
          else
            echo "✅ Successfully published ${{ steps.resolve.outputs.workspaceName }}@${{ steps.resolve.outputs.version }}"
          fi
