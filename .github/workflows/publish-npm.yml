name: publish-npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（默认使用触发时的 ref_name）"
        required: false
        type: string
  push:
    tags:
      - "@guangyiliushan/**"

permissions:
  contents: read

jobs:
  publish:
    if: secrets.NPM_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - id: resolve
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          node scripts/resolve-workspace-from-tag.mjs "$TAG" > /tmp/uml-flow-tag.json
          node -e "const v=require('fs').readFileSync('/tmp/uml-flow-tag.json','utf8');const j=JSON.parse(v);if(!j.ok) process.exit(1);console.log('workspaceName='+j.workspaceName);console.log('version='+j.version);" >> "$GITHUB_OUTPUT"
      - run: npm publish --workspace "${{ steps.resolve.outputs.workspaceName }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
