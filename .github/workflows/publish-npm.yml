name: Publish to NPM

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch/tag/sha) to publish from
        required: false
        default: main
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch/tag/sha) to publish from
        required: false
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Public Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Ensure NPM_TOKEN is set
        if: env.NPM_TOKEN == ''
        shell: bash
        run: |
          echo "Error: NPM_TOKEN is not set" >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.3

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Collect publish targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/publish-targets.json
          const fs = require("node:fs");
          const path = require("node:path");

          const packagesDir = path.join(process.cwd(), "packages");
          const dirs = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((d) => d.isDirectory())
            .map((d) => d.name);

          const targets = [];
          for (const dir of dirs) {
            const p = path.join(packagesDir, dir, "package.json");
            const json = JSON.parse(fs.readFileSync(p, "utf8"));
            if (json.private === true) continue;
            if (typeof json.name !== "string" || json.name.length === 0) continue;
            targets.push({ name: json.name, dir, version: String(json.version ?? "") });
          }

          process.stdout.write(JSON.stringify({ ok: true, targets }, null, 2));
          NODE

          echo "Targets:"
          cat /tmp/publish-targets.json

      - name: Publish public packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          node -e "const j=require('/tmp/publish-targets.json'); if(!j.ok) process.exit(1); for(const t of j.targets){ if(!t.name||!t.version) continue; console.log(t.name+'\t'+t.version); }" \
            | while IFS=$'\t' read -r name version; do
                if [ -z "$name" ] || [ -z "$version" ]; then
                  continue
                fi

                if npm view "$name@$version" version &>/dev/null; then
                  echo "Skip: $name@$version already published"
                  continue
                fi

                echo "Publishing $name@$version"
                pnpm -w --filter "$name" publish --access public --no-git-checks
              done

      - name: Publish success
        if: success()
        run: echo "✅ Publish step completed"
