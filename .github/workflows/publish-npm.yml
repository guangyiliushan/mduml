name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (defaults to triggering ref_name)"
        required: false
        type: string
  push:
    tags:
      - "@mduml/*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish Package
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Resolve workspace from tag
        id: resolve
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Resolving tag: $TAG"
          node scripts/resolve-workspace-from-tag.mjs "$TAG" > /tmp/uml-flow-tag.json
          
          # Parse and validate
          WORKSPACE_NAME=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/uml-flow-tag.json','utf8')); if(!j.ok) { console.error('Invalid tag'); process.exit(1); } console.log(j.workspaceName);")
          WORKSPACE_DIR=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/uml-flow-tag.json','utf8')); if(!j.ok) process.exit(1); console.log(j.workspaceDir);")
          VERSION=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/uml-flow-tag.json','utf8')); console.log(j.version);")
          
          echo "workspaceName=$WORKSPACE_NAME" >> "$GITHUB_OUTPUT"
          echo "workspaceDir=$WORKSPACE_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $WORKSPACE_NAME@$VERSION"

      - name: Verify package exists
        run: |
          if [ ! -d "packages/${{ steps.resolve.outputs.workspaceDir }}" ]; then
            echo "Error: Package directory not found"
            exit 1
          fi

      - name: Check if package is publishable
        id: publishable
        shell: bash
        run: |
          PRIVATE=$(node -e "const p=require('./packages/${{ steps.resolve.outputs.workspaceDir }}/package.json'); console.log(String(!!p.private));")
          if [ "$PRIVATE" = "true" ]; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publish: ${{ steps.resolve.outputs.workspaceName }} is private"
          else
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure NPM_TOKEN is set
        if: steps.publishable.outputs.publishable == 'true' && env.NPM_TOKEN == ''
        shell: bash
        run: |
          echo "Error: NPM_TOKEN is not set"
          exit 1

      - name: Configure npm authentication
        if: steps.publishable.outputs.publishable == 'true'
        shell: bash
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Check if already published
        id: check
        if: steps.publishable.outputs.publishable == 'true'
        run: |
          PACKAGE_NAME="${{ steps.resolve.outputs.workspaceName }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          
          if npm view "$PACKAGE_NAME@$VERSION" version &>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Package $PACKAGE_NAME@$VERSION is already published"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "✅ Package $PACKAGE_NAME@$VERSION is not published yet"
          fi

      - name: Publish to NPM
        if: steps.publishable.outputs.publishable == 'true' && steps.check.outputs.already_published == 'false'
        run: |
          echo "Publishing ${{ steps.resolve.outputs.workspaceName }}@${{ steps.resolve.outputs.version }}"
          npm publish --workspace "${{ steps.resolve.outputs.workspaceName }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish success
        if: steps.publishable.outputs.publishable == 'true' && success()
        run: |
          echo "✅ Successfully published ${{ steps.resolve.outputs.workspaceName }}@${{ steps.resolve.outputs.version }}"
