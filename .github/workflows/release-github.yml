name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to create/update a GitHub Release for
        required: true
        type: string
  push:
    tags:
      - "@mduml/*"
      - "release-v*"
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
