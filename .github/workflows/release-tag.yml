name: Create Release Tags

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Generate and Push Tags
    # Only run on manual trigger or non-release commits
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Snapshot tags before release
        shell: bash
        run: |
          git tag --list --sort=refname > /tmp/tags-before.txt

      - name: Generate semantic-release tags
        run: pnpm run release:tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch packaging workflows for new adapter tags
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag --list --sort=refname > /tmp/tags-after.txt
          NEW_TAGS=$(comm -13 /tmp/tags-before.txt /tmp/tags-after.txt)
          echo "New tags:"
          echo "$NEW_TAGS"

          dispatch() {
            local workflow_file="$1"
            local tag="$2"
            export TAG="$tag"
            BODY=$(node -e "console.log(JSON.stringify({ref:'main',inputs:{ref:process.env.TAG,tag:process.env.TAG}}))")
            curl -sS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" \
              -d "$BODY" \
              >/dev/null
          }

          while IFS= read -r t; do
            [ -n "$t" ] || continue
            case "$t" in
              @mduml/adapter-vscode-*|@mduml/adapter-vscode@*)
                dispatch "package-vsix.yml" "$t"
                ;;
              @mduml/adapter-obsidian-*|@mduml/adapter-obsidian@*)
                dispatch "package-obsidian.yml" "$t"
                ;;
              *)
                ;;
            esac
          done <<< "$NEW_TAGS"

      - name: Verify tags created
        run: |
          echo "Recent tags:"
          git tag --sort=-version:refname | head -5
