name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Determine Version & Tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.diff.outputs.released }}
      tag: ${{ steps.diff.outputs.tag }}
    # semantic-release is configured for main only; skip release commits pushed by semantic-release itself ([skip ci] is also honored)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore(release):'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.3

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Snapshot tags before release
        shell: bash
        run: git tag --list 'v[0-9]*' > /tmp/tags-before.txt

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release -e ./release.tag.cjs

      - name: Detect new version tag
        id: diff
        shell: bash
        run: |
          git tag --list 'v[0-9]*' > /tmp/tags-after.txt
          NEW_TAG="$(comm -13 /tmp/tags-before.txt /tmp/tags-after.txt | tail -n 1)"
          if [ -n "$NEW_TAG" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "Released: $NEW_TAG"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No commits eligible for release; skipping downstream jobs"
          fi

  artifacts:
    name: Build VSIX & Obsidian Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tag
    if: needs.tag.outputs.released == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.3

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Package VS Code extension
        run: pnpm -w --filter @mduml/adapter-vscode run package:vsix

      - name: Package Obsidian plugin
        run: pnpm -w --filter @mduml/adapter-obsidian run package:plugin

      - name: Zip Obsidian plugin
        id: zip
        shell: bash
        run: |
          PLUGIN_ID="$(node -p "require('./packages/adapter-obsidian/manifest.json').id")"
          TAG="${{ needs.tag.outputs.tag }}"
          ZIP_NAME="obsidian-${PLUGIN_ID}-${TAG}.zip"
          test -d "packages/adapter-obsidian/dist/obsidian-plugin/${PLUGIN_ID}"
          (cd "packages/adapter-obsidian/dist/obsidian-plugin" && zip -r "../${ZIP_NAME}" "${PLUGIN_ID}")
          echo "zipPath=packages/adapter-obsidian/dist/${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ needs.tag.outputs.tag }}
          path: |
            packages/adapter-vscode/dist/vsix/mduml.vsix
            ${{ steps.zip.outputs.zipPath }}
          if-no-files-found: error

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: |
            packages/adapter-vscode/dist/vsix/mduml.vsix
            ${{ steps.zip.outputs.zipPath }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to NPM
    needs: tag
    if: needs.tag.outputs.released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
    secrets: inherit
